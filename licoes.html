<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lições — Aprendendo Devagar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="bar">
    <a href="index.html" class="brand">Aprendendo Devagar</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="licoes.html">Lições</a>
      <a href="jogo.html">Quiz</a>
      <a href="frase.html">Frase</a>
      <span id="userChip">
        <span id="userName"></span>
        <button id="btnLogout">Sair</button>
      </span>
    </nav>
  </div>
</header>

<main>
  <!-- Aparece só se a pessoa não estiver logada -->
  <div id="lockedNote" class="wrap locked-note" style="display:none; margin-top:40px;">
    Você precisa fazer login para ver as lições. <a href="index.html">Voltar e entrar</a>.
  </div>

  <!-- Aparece só se a pessoa estiver logada -->
  <section class="wrap" id="licoesArea" style="display:none; padding-top:36px;">
    <h2>Lições de vocabulário</h2>
    <div id="topicList"></div>
  </section>
</main>

<script type="module">
import { auth, onAuthStateChanged, signOut } from "./firebase.js";
import { VOCABULARIO } from "./vocabulario.js";

document.getElementById('btnLogout').onclick = () => signOut(auth);

// Mostra a página de lições só se a pessoa estiver logada
onAuthStateChanged(auth, (user) => {
  const userChip = document.getElementById('userChip');
  if (user) {
    userChip.style.display = 'flex';
    document.getElementById('userName').textContent = user.displayName || user.email;
    document.getElementById('lockedNote').style.display = 'none';
    document.getElementById('licoesArea').style.display = 'block';
    renderTopicos();
  } else {
    userChip.style.display = 'none';
    document.getElementById('lockedNote').style.display = 'block';
    document.getElementById('licoesArea').style.display = 'none';
  }
});

// Explicação de cada tópico
const TOPICOS = {
  "saudações": { emoji: "👋", en: "Greetings", cor: "#B9714C", explicacao: "Aprenda a cumprimentar, agradecer e se despedir em inglês." },
  "números":   { emoji: "🔢", en: "Numbers", cor: "#355E63", explicacao: "Aprenda a contar em inglês, do um ao dez." },
  "cores":     { emoji: "🎨", en: "Colors", cor: "#6B7F4F", explicacao: "Conheça o nome das cores em inglês." },
  "animais":   { emoji: "🐾", en: "Animals", cor: "#8A6A4F", explicacao: "Vocabulário de animais comuns, do gato ao tubarão." },
  "comidas":   { emoji: "🍎", en: "Food", cor: "#C1502E", explicacao: "Palavras sobre comidas e bebidas do dia a dia." },
  "dias e meses": { emoji: "📅", en: "Days and Months", cor: "#23454A", explicacao: "Aprenda os dias da semana e os meses do ano." },
};

// Deixa só a primeira letra maiúscula 
function capitalizar(texto) {
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

// Guarda qual tópico está aberto no momento (null = nenhum)
let topicoAberto = null;

// Desenha a lista de tópicos; se um estiver aberto, mostra as palavras dele
function renderTopicos() {
  const topicList = document.getElementById('topicList');
  topicList.innerHTML = '';

  Object.keys(TOPICOS).forEach(cat => {
    const info = TOPICOS[cat];
    const estaAberto = topicoAberto === cat;

    const card = document.createElement('div');
    card.style.marginBottom = '14px';

    const header = document.createElement('button');
    header.className = 'topic-pill' + (estaAberto ? ' active' : '');
    header.style.background = info.cor;
    header.style.width = '100%';
    header.style.display = 'block';
    header.innerHTML = `
      <span class="emoji">${info.emoji}</span>
      <span class="label">${capitalizar(cat)} / ${info.en}</span>
      <span style="display:block; font-size:0.85rem; opacity:0.9; margin-top:4px; font-weight:400;">${info.explicacao}</span>
    `;
    header.onclick = () => {
      topicoAberto = estaAberto ? null : cat;
      renderTopicos();
    };
    card.appendChild(header);

    // Se esse tópico está aberto, mostra as palavras dele
    if (estaAberto) {
      const grid = document.createElement('div');
      grid.className = 'stamp-grid';
      grid.style.marginTop = '12px';

      VOCABULARIO.filter(v => v.cat === cat).forEach(item => {
        const div = document.createElement('div');
        div.className = 'stamp';
        div.style.borderLeftColor = info.cor;
        div.innerHTML = `
          <p class="en">${item.en}</p>
          <p class="pt">${item.pt}</p>
        `;
        grid.appendChild(div);
      });

      card.appendChild(grid);
    }

    topicList.appendChild(card);
  });
}
</script>

</body>
</html>
